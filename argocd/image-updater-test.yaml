# Argo CD Image Updater for the test environment only (YGP-82, ADR-0021
# option A). When the `testing` tag on Docker Hub moves to a new image, Image
# Updater sets that image's digest on the ads-test application, and Argo CD
# rolls the pods onto it. Nothing is written to Git, so no token is needed.
#
# Production (ads-prod) isn't listed: it changes only through a reviewed pull
# request that pins the commit SHA (ADR-0021 option C).
#
# Applied once by hand, after Image Updater is installed (see the README).
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: ads-test
  namespace: argocd
spec:
  # Store the digest on the Argo CD application (the default), not in Git.
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: ads-test
      commonUpdateSettings:
        # Follow the `testing` tag and pick up each new image behind it.
        updateStrategy: digest
      images:
        - alias: api
          imageName: glossia/ai-dubbing-studio-api:testing
        - alias: translator
          imageName: glossia/ai-dubbing-studio-translator:testing
---
# Image Updater's own settings. It reads them when it starts, so restart it
# after changing them: kubectl -n argocd rollout restart deploy/argocd-image-updater-controller
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater-config
    app.kubernetes.io/part-of: argocd-image-updater-controller
data:
  # Check Docker Hub every 15 minutes instead of 2. Docker Hub allows 100
  # pulls per 6 hours per public IP without a login (200 with a free one), all
  # six nodes share one IP, and the nodes' own image pulls count too. Two
  # images every 15 minutes is at most 48 checks per 6 hours. A webhook from
  # Docker Hub could replace polling once the tunnel is public (follow-up).
  interval: 15m
  # Log in to Docker Hub with a read-only token, for the higher limit. The
  # Secret is created by hand in the argocd namespace (see README), never in Git.
  registries.conf: |
    registries:
      - name: Docker Hub
        prefix: docker.io
        api_url: https://registry-1.docker.io
        credentials: pullsecret:argocd/dockerhub-pull
        defaultns: library
        default: true
