# The cluster's VMs.
#
# k3s_servers: the control plane, with an etcd member on each. Keep the number
#   odd (3 or 5) so etcd keeps a majority when one is down. The first one
#   listed started the cluster; the others joined it.
# k3s_agents: workers. Add a VM here and run site.yml --limit <name>.
#
# Names become Kubernetes node names: lowercase letters, digits and "-".
# ansible_host must be the VM's LAN address: the others use it to reach the
# cluster.
all:
  vars:
    ansible_user: administrator
  children:
    k3s_servers:
      hosts:
        ads-server-a:
          ansible_host: 10.108.159.43
        ads-server-b:
          ansible_host: 10.108.153.26
        ads-server-c:
          ansible_host: 10.108.159.83
    k3s_agents:
      hosts:
        ads-agent-1:
          ansible_host: 10.108.152.247
        ads-agent-2:
          ansible_host: 10.108.154.121
        ads-agent-3:
          ansible_host: 10.108.155.160
    # The Hetzner VM with LiveKit's public address (YGP-109), set up by
    # relay.yml. It isn't part of the cluster: the LiveKit pods dial out to it
    # over WireGuard, and it forwards browsers' media and signaling to them.
    # ansible_host is its public IPv4 address. Hetzner's images log in as root.
    relay:
      hosts:
        hetzner-relay:
          ansible_host: 203.0.113.10
          ansible_user: root
