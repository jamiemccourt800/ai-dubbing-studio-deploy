# Sets up the Hetzner relay: LiveKit's public address (YGP-109). The LiveKit
# pods connect to it over WireGuard; it forwards browsers' media (UDP and TCP)
# to them and serves their signaling (wss://) with Caddy. Safe to rerun.
#
#   ansible-playbook relay.yml
---
- name: Set up the Hetzner relay
  hosts: relay
  become: true
  pre_tasks:
    - name: Each peer needs a tunnel address, and a valid public key or none
      ansible.builtin.assert:
        that:
          - item.tunnel_ip is match('^10\.8\.0\.([2-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-4])$')
          - item.public_key == '' or item.public_key is match('^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$')
        fail_msg: >-
          {{ item.name }}: tunnel_ip must be in 10.8.0.2-254, and public_key a
          WireGuard public key (from "wg pubkey") or empty.
        quiet: true
      loop: "{{ relay_peers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: No two peers may share a tunnel address or a media port
      vars:
        relay_all_ips: "{{ relay_peers | map(attribute='tunnel_ip') | list }}"
        relay_all_ports: "{{ relay_peers | map(attribute='media_ports') | flatten | map(attribute='port') | list }}"
      ansible.builtin.assert:
        that:
          - relay_all_ips | unique | length == relay_all_ips | length
          - relay_all_ports | unique | length == relay_all_ports | length
        fail_msg: Each peer needs its own tunnel_ip and its own media ports.
      run_once: true
  roles:
    - relay
