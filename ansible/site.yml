# Turns the VMs in the inventory into one K3s cluster, or adds new ones to it.
# Safe to rerun: nodes that are already set up are left as they are. No single
# server has to be up: nodes join through whichever one answers.
#
#   ansible-playbook site.yml
#   ansible-playbook site.yml --limit ads-agent-4     # only add a new VM
---
- name: Prepare every node
  hosts: k3s_servers:k3s_agents
  become: true
  pre_tasks:
    - name: Servers must be an odd number, so etcd keeps a majority
      ansible.builtin.assert:
        that:
          - groups['k3s_servers'] | default([]) | length > 0
          - groups['k3s_servers'] | length is odd
        fail_msg: >-
          k3s_servers has {{ groups['k3s_servers'] | default([]) | length }}
          hosts. Use 1, 3 or 5.
      run_once: true

    - name: Host names must be valid Kubernetes node names
      ansible.builtin.assert:
        that: item is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        fail_msg: >-
          {{ item }} becomes a node name, which may only have lowercase
          letters, digits and "-".
        quiet: true
      loop: "{{ groups['k3s_servers'] + groups['k3s_agents'] | default([]) }}"
      run_once: true
  roles:
    - prereq

# One at a time: each new server must be a full etcd member before the next
# joins.
- name: Set up the servers
  hosts: k3s_servers
  become: true
  serial: 1
  roles:
    - k3s_server

- name: Join the agents
  hosts: k3s_agents
  become: true
  roles:
    - k3s_agent

# From the first server that is reachable. The kubeconfig points at
# k3s_api_name, which resolves to every server (see README).
- name: Save a kubeconfig on this machine
  hosts: k3s_servers
  become: true
  tasks:
    - name: Fetch the admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_admin_kubeconfig
      run_once: true

    - name: Write it, pointed at the cluster's name instead of localhost
      ansible.builtin.copy:
        content: >-
          {{ k3s_admin_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' ~ k3s_api_name ~ ':6443') }}
        dest: "{{ k3s_kubeconfig_local }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true

    # kubectl tries each address of k3s_api_name in turn, so it keeps working
    # while a server is down. Needs sudo on this machine.
    - name: Make k3s_api_name resolve to every server on this machine
      when: k3s_local_hosts_entries | bool
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} {{ k3s_api_name }}: K3s servers (ai-dubbing-studio-deploy/ansible)"
        block: |
          {% for server in groups['k3s_servers'] %}
          {{ hostvars[server]['ansible_host'] }} {{ k3s_api_name }}
          {% endfor %}
        # /etc/hosts is a mounted file in WSL and containers, which can't be
        # replaced by renaming; write it in place instead.
        unsafe_writes: true
      delegate_to: localhost
      run_once: true
