name: Ansible

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Pinned, so a new release can't break or change the check.
      - run: pip install ansible==14.6.0 ansible-lint==26.11.0
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook --syntax-check site.yml remove.yml relay.yml
      - run: ansible-lint --profile production site.yml remove.yml relay.yml
