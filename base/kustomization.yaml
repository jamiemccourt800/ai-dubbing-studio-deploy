# What every environment runs. The overlays in ../overlays add the namespace,
# the image tags, the host name and the media ports.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - redis.yaml
  - livekit.yaml
  - api.yaml
  - translator.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: ai-dubbing-studio
