# What every environment runs. The overlays in ../overlays add the namespace,
# the image tag, the host name and the media ports.
#
# Not here yet: Redis and the translation worker pool (ADR-0018), which come
# with the translator work in the app repo (#39).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - livekit.yaml
  - api.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: ai-dubbing-studio
