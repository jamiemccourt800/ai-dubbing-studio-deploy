# The public endpoint (YGP-92): a Cloudflare Tunnel from inside the cluster to
# Cloudflare, applied once per cluster. Visitors reach glossia.ie and
# test.glossia.ie at Cloudflare, which terminates HTTPS with its own
# certificate and renews it; cloudflared carries the requests (WebSockets too)
# to K3s's Traefik, which routes them by host name to each environment's API.
# No port on the VMs or the router is opened for this.
#
# The tunnel's token is the only secret, created by hand (see README). Which
# host names use the tunnel is set by their DNS records at Cloudflare.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared
data:
  # Every host name goes to Traefik, which knows which environment is which.
  # Used only when the tunnel was created with the cloudflared CLI; a tunnel
  # created in the dashboard takes its routes from there instead.
  config.yaml: |
    ingress:
      - service: http://traefik.kube-system.svc.cluster.local:80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels: { app: cloudflared }
spec:
  # Two copies on different nodes: the site stays up while one VM is down.
  replicas: 2
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: cloudflared }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args:
            - tunnel
            - --no-autoupdate
            - --config
            - /etc/cloudflared/config.yaml
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: tunnel, key: token }
          ports:
            - name: metrics
              containerPort: 2000
          # /ready answers 200 once the pod has a live connection to Cloudflare.
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
      volumes:
        - name: config
          configMap: { name: cloudflared }
