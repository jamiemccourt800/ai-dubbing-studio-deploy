# The read-only login for Headlamp (ADR-0024 in the app repo). Its token comes
# from viewer-token.yaml, filled in by Kubernetes; none is stored in Git.
#
# Kubernetes' built-in `view` role lets it read workloads, logs and events in
# every namespace, but not Secrets, and it can't change anything. `view` only
# covers namespaced things, so headlamp-viewer-cluster adds read access to the
# cluster-wide ones Headlamp shows: nodes, volumes and storage classes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-viewer-cluster
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-viewer-cluster
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: headlamp
