# The test environment: what's merged into the app repo's `testing` branch.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ads-test
resources:
  - namespace.yaml
  - ../../base
components:
  # LiveKit through the Hetzner relay (YGP-109).
  - ../../components/livekit-relay
images:
  # Built and pushed by the app repo's Images workflow (YGP-52).
  - name: ai-dubbing-studio-api
    newName: glossia/ai-dubbing-studio-api
    newTag: 5b35d50cb30caecd4b18a5e2897e585d97cfc669
  - name: ai-dubbing-studio-translator
    newName: glossia/ai-dubbing-studio-translator
    newTag: 5b35d50cb30caecd4b18a5e2897e585d97cfc669
patches:
  # The `testing` tags move to each new image, so the API and the workers
  # always pull them: with the default (IfNotPresent) a new pod on a node that
  # already has an older image would keep running it.
  - target: { kind: Deployment, name: "^(api|translator)$" }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # The /internal block's middleware, in this environment's namespace.
  - target: { kind: Ingress, name: api-internal }
    patch: |
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: ads-test-deny-internal@kubernetescrd
  # The address browsers use for the test environment. Public through the
  # Cloudflare Tunnel (YGP-92), which serves it over HTTPS.
  - target: { kind: ConfigMap, name: api-config }
    patch: |
      - op: replace
        path: /data/BETTER_AUTH_URL
        value: https://test.glossia.ie
  # Both Ingresses: the API, and the /internal block in front of it.
  - target: { kind: Ingress }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: test.glossia.ie
  # The address browsers connect to LiveKit at: Caddy on the Hetzner relay
  # (YGP-109). The API gives it to them with their tokens.
  - target: { kind: ConfigMap, name: api-config }
    patch: |
      - op: add
        path: /data/LIVEKIT_PUBLIC_URL
        value: wss://livekit.test.glossia.ie
