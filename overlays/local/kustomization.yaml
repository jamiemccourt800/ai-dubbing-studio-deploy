# For trying the manifests on your own machine with k3d (see README). Uses the
# API and worker images you built and imported yourself, not Docker Hub's.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ads-local
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ai-dubbing-studio-api
    newTag: local
  - name: ai-dubbing-studio-translator
    newTag: local
