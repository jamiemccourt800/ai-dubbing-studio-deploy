# Production: what's merged into the app repo's `main` branch.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ads-prod
resources:
  - namespace.yaml
  - ../../base
components:
  # LiveKit through the Hetzner relay (YGP-109).
  - ../../components/livekit-relay
images:
  # Built and pushed by the app repo's Images workflow (YGP-52).
  - name: ai-dubbing-studio-api
    newName: glossia/ai-dubbing-studio-api
    newTag: prod
  - name: ai-dubbing-studio-translator
    newName: glossia/ai-dubbing-studio-translator
    newTag: prod
patches:
  # The `prod` tags move to each new image, so the API and the workers always
  # pull them: with the default (IfNotPresent) a new pod on a node that already
  # has an older image would keep running it.
  - target: { kind: Deployment, name: "^(api|translator)$" }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # The /internal block's middleware, in this environment's namespace.
  - target: { kind: Ingress, name: api-internal }
    patch: |
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: ads-prod-deny-internal@kubernetescrd
  # The address browsers use for production. Public through the Cloudflare
  # Tunnel (YGP-92), which serves it over HTTPS.
  - target: { kind: ConfigMap, name: api-config }
    patch: |
      - op: replace
        path: /data/BETTER_AUTH_URL
        value: https://glossia.ie
  # Both Ingresses: the API, and the /internal block in front of it.
  - target: { kind: Ingress }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: glossia.ie
  # Media ports 7891 (TCP) and 7892 (UDP), so production and test can share the
  # relay's address: test keeps the base's 7881 and 7882.
  - target: { kind: ConfigMap, name: livekit-config }
    patch: |
      - op: replace
        path: /data/livekit.yaml
        value: |
          port: 7880
          rtc:
            tcp_port: 7891
            udp_port: 7892
            use_external_ip: false
          logging:
            level: info
  - target: { kind: Deployment, name: livekit }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/ports/1
        value: { name: rtc-tcp, containerPort: 7891, protocol: TCP }
      - op: replace
        path: /spec/template/spec/containers/0/ports/2
        value: { name: rtc-udp, containerPort: 7892, protocol: UDP }
  # The address browsers connect to LiveKit at: Caddy on the Hetzner relay
  # (YGP-109). The API gives it to them with their tokens.
  - target: { kind: ConfigMap, name: api-config }
    patch: |
      - op: add
        path: /data/LIVEKIT_PUBLIC_URL
        value: wss://livekit.glossia.ie
  # Production's address in the tunnel: ads-prod in ansible/group_vars/relay.yml.
  - target: { kind: ConfigMap, name: wireguard }
    patch: |
      - op: replace
        path: /data/WG_ADDRESS
        value: 10.8.0.3/24
